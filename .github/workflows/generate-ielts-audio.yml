name: Generate IELTS Part 2 MP3 (MiniMax)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'One topic ID, or all (25 topics; 1 paid TTS call each)'
        required: true
        default: P16
        type: string

permissions:
  contents: read

concurrency:
  group: minimax-tts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TOPIC: ${{ inputs.topic }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate all 25 topic extracts and filenames (free)
        run: python scripts/minimax_part2_tts.py --topic all --dry-run

      - name: Generate spoken English topic and answer (MiniMax official API)
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_API_BASE: ${{ vars.MINIMAX_API_BASE || 'https://api.minimaxi.com/v1' }}
        run: python scripts/minimax_part2_tts.py --topic "$TOPIC" --model speech-2.8-hd --voice English_Trustworthy_Man --speed 0.85

      - name: Upload MP3 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ielts-part2-mp3-${{ env.TOPIC }}
          path: speaking/part2/audio/*.mp3
          if-no-files-found: warn
          retention-days: 7
