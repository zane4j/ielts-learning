name: Download HeyGen IELTS Part 2 (24 MP3)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-and-zip:
    name: Download, verify, and package 24 MP3s
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and verify HeyGen recordings
        run: |
          python3 scripts/download_heygen_part2.py \
            --manifest speaking/part2/people/heygen_audio_24.json \
            --output dist/IELTS_Part2_Zoe_24_MP3.zip

      - name: Upload ZIP as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: IELTS-Part2-Zoe-24-MP3
          path: dist/IELTS_Part2_Zoe_24_MP3.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
